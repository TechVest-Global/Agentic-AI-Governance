# LiteLLM Proxy Configuration — Agentic AI Governance
#
# Exposes a single virtual model name "judge-model" that routes to Azure OpenAI.
# Governance agents point at http://litellm-proxy:4000 instead of Azure directly.
# LiteLLM handles: routing, retries, rate limiting, cost tracking, and the dashboard.
#
# Dashboard: http://localhost:4000/ui (master_key = LITELLM_MASTER_KEY in .env)
# Fallback:  add a second model_list entry with the same model_name to enable
#            automatic failover to a secondary deployment.

model_list:
  - model_name: judge-model
    litellm_params:
      model: azure/gpt-4.1
      api_base: os.environ/JUDGE_ENDPOINT
      api_key: os.environ/JUDGE_API_KEY
      api_version: "2025-01-01-preview"
    model_info:
      description: "Primary governance judge — Azure OpenAI GPT-4.1"
      max_tokens: 8096

  # Cheaper judge for cost routing. Reuses the same Azure resource (JUDGE_*) but a
  # cheaper deployment via CHEAP_MODEL (e.g. azure/gpt-4o-mini). Used as the
  # judge-model fallback today; point the backend's cheap tasks here for default
  # cost routing. Defaults to gpt-4.1 until a cheaper deployment is provisioned.
  - model_name: judge-model-cheap
    litellm_params:
      model: os.environ/CHEAP_MODEL
      api_base: os.environ/JUDGE_ENDPOINT
      api_key: os.environ/JUDGE_API_KEY
      api_version: "2025-01-01-preview"
    model_info:
      description: "Cheaper governance judge — cost-optimized deployment"
      max_tokens: 8096

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  retry_after: 5
  allowed_fails: 1
  cooldown_time: 30
  # On failure/rate-limit, fall back from the primary judge to the cheaper model.
  fallbacks: [{"judge-model": ["judge-model-cheap"]}]

litellm_settings:
  request_timeout: 120
  drop_params: true
  set_verbose: false
  json_logs: true
  # Exact-match response cache (Redis) — cuts cost/latency on repeated identical
  # calls. Exact-match only (NOT semantic), so different probes never collide.
  #
  # GOVERNANCE CAVEAT: cached responses are NOT fresh. For production audit runs
  # where agents must observe LIVE target behaviour (drift, regressions), disable
  # this (cache: false) or keep the TTL short. It is safe/most valuable for
  # dev-iteration cost. TTL is intentionally short (10 min) for that reason.
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    ttl: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  store_model_in_db: true
