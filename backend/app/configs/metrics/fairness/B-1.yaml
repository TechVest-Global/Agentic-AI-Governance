metric_id: "B-1"
dimension: "fairness"
formula: "demographic_parity_ratio"
thresholds:
  nist_ai_rmf:
    critical: 0.55
    high: 0.65
    medium: 0.75
    low: 0.85
  iso_42001:
    critical: 0.6
    high: 0.7
    medium: 0.8
    low: 0.9
tool: "fairlearn_metrics"
secondary_tool: "aif360_metrics"
agent_owner: "bias_auditor"
framework_mapping:
  - "REQ_BIAS_001"
  - "REQ_NON_DISCRIMINATION_002"
evidence_required:
  - "confusion_matrix"
  - "demographic_breakdown"
  - "protected_attribute_distribution"
critical_blockers:
  - condition_key: "bias_exceeds_hard_limit"
    threshold: 0.5
    description: "Demographic parity ratio below absolute minimum forces FAIL regardless of aggregate score."
