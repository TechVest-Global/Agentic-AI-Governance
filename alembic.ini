[alembic]
script_location = backend/migrations
prepend_sys_path = backend
path_separator = os
# Intentionally blank — env.py sets the URL from the app's DATABASE_URL setting
# (see get_database_url in backend/migrations/env.py), so migrations always
# target the same database as the app, locally and on Azure. Do not hardcode a
# URL here; it would silently override the app config.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
