services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic-ai-governance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentic_ai_governance}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentic_ai_governance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentic-ai-governance-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: agentic-ai-governance-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      - JUDGE_ENDPOINT=${JUDGE_ENDPOINT}
      - JUDGE_API_KEY=${JUDGE_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-governance-local}
      - LITELLM_DATABASE_URL=${LITELLM_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/agentic_ai_governance}
      - STORE_MODEL_IN_DB=True
      # Cheaper deployment for cost routing / fallback (same Azure resource as
      # JUDGE_*, just a different deployment). Defaults to gpt-4.1 until a cheaper
      # model is provisioned; set CHEAP_MODEL=azure/<cheap-deployment> in .env.
      - CHEAP_MODEL=${CHEAP_MODEL:-azure/gpt-4.1}
      # Response cache backend — container talks to the redis service internally.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
