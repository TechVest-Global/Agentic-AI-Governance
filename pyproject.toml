[project]
name = "agentic-ai-governance"
version = "0.1.0"
description = "Backend foundation for a GenAI governance engine with append-only audit state and compliance-driven evaluation."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.111.0",
    "jsonschema>=4.22.0",
    "openai>=1.30.0",
    "psycopg[binary]>=3.1.0",
    "pydantic-settings>=2.2.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.7",
    "pypdf>=5.0.0",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.21",
    "uvicorn[standard]>=0.30.0",
    "presidio-analyzer>=2.2.0",
    "ragas>=0.2.0",
    "deepeval>=2.0.0",
    "garak>=0.13.0",
    "inspect-ai>=0.3.0",
    "langfuse>=3.0.0",
    "jiwer>=3.0.0",
    "pillow>=10.0.0",
    # Video frame extraction for the vision evaluator's temporal_consistency
    # formula (CM-033). Bundles its own ffmpeg build — no separate system
    # binary install needed, unlike a raw ffmpeg-CLI/opencv approach.
    "av>=13.0.0",
    # ragas's langchain-community/-openai stack and garak's own langchain/openai
    # requirement do not resolve together on their default (latest) versions —
    # ragas imports break on langchain-community>=0.4 (removed vertexai submodule)
    # and on openai>=2.0 (langchain-openai 1.x expects APIs from openai<2.0).
    # These pins are the verified-working combination for both libraries at once.
    "langchain-community==0.3.27",
    "langchain-openai==0.3.27",
    "langchain-core==0.3.86",
    "openai<2.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]
# WARNING: PyRIT pins openai>=2.2, which conflicts with this project's
# openai<2.0 (required by the ragas/garak stack). Do NOT install this extra into
# the main venv — it will break garak/ragas. PyRIT runs in a SEPARATE isolated
# interpreter that the pyrit evaluator shells out to:
#   python -m venv .venv-pyrit
#   .venv-pyrit/Scripts/python -m pip install "pyrit>=0.14.0"   # (bin/python on POSIX)
# Override the interpreter path with the PYRIT_PYTHON env var if needed.
pyrit = [
    "pyrit>=0.14.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/versions/*.py" = ["E501"]
# Seed scripts embed long descriptive profile/prose strings verbatim.
"backend/scripts/seed_*.py" = ["E501"]
# conftest neutralizes credential env vars before importing app modules.
"backend/tests/conftest.py" = ["E402"]
# Test fixtures/payloads read better inline than hand-wrapped; not shipped code.
"backend/tests/*.py" = ["E501"]
# Evaluator modules embed long, verbatim judge-prompt/template strings — same
# rationale as seed_*.py above; wrapping mid-prompt would hurt readability.
"backend/app/services/evaluators/*.py" = ["E501"]
# Standalone report-formatting script, not imported by the app.
"backend/scripts_build_metric_report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
